version = "1.0"

[server]
bind = "0.0.0.0:8080"
admin_bind = "127.0.0.1:9090"
graceful_shutdown_ms = 5000

[logging]
level = "info"
format = "json"
output = "stdout"

[wasm]
runtime = "wazero"
cache_dir = "./cache/wasm"
max_modules = 64

# -------------------------
# WAF inline mode (config + request send at each call/request)
# -------------------------
[[modules]]
id = "waf"
enabled = true
path = "./modules/scloud-eg-waf/target/wasm32-wasip1/release/scloud_eg_waf.wasm"
route = "/"
timeout_ms = 200
config_mode = "inline" # "init" | "inline"

# (optionnal)
# entry_fn = "handle"
# alloc_fn = "alloc"
# init_fn  = "init"

    [modules.config]
    mode = "block" # "block" | "log" | "disabled"
    log = true
    blocked_status = 403

    # limites & parsing
    max_header_bytes = 16384
    max_body_bytes   = 1048576 # 1MB
    inspect_body     = false
    normalize_path   = true

    # allowlist / denylist
    allowed_methods = ["GET","POST","PUT","DELETE","PATCH","HEAD","OPTIONS"]
    ip_allowlist = ["10.0.0.0/8", "192.168.0.0/16", "127.0.0.1/24"]
    ip_denylist  = ["1.2.3.4/32"]

    block_path_prefixes = ["/admin", "/.git"]

    rules_path = "waf.json"
    rules_reload_seconds = 60

# -------------------------
# RateLimit init mode (config injected at init, request without config sent at each call)
# -------------------------
[[modules]]
id = "ratelimit"
enabled = true
path = "./modules/scloud-eg-rate-limit/target/wasm32-wasip1/release/scloud_eg_rate_limit.wasm"
route = "/rate-limit"
timeout_ms = 50
config_mode = "init" # "init" | "inline"

# (optionnal)
# entry_fn = "handle"
# alloc_fn = "alloc"
# init_fn  = "init"

  [modules.config]
  max_requests = 10
  window_seconds = 30
