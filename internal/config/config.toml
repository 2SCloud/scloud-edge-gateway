version = "1.0"

[server]
bind = "0.0.0.0:8080"
admin_bind = "127.0.0.1:9090"
graceful_shutdown_ms = 5000

[logging]
level = "info"
format = "json"
output = "stdout"

[wasm]
runtime = "wazero"
cache_dir = "./cache/wasm"
max_modules = 64

# -------------------------
# WAF inline mode (config + request send at each call/request)
# -------------------------
[[modules]]
id = "waf"
enabled = true
path = "./modules/scloud-eg-waf/target/wasm32-wasip1/release/scloud_eg_waf.wasm"
route = "/"
timeout_ms = 200

config_mode = "inline"   # "init" | "inline"

[module.config]
mode = "block"
rules_path = "/etc/edge/rules.json"
log = true 
# --- ADDED BASIC PARAMETERS ---
max_body_size_kb = 2048         # Limits request size to prevent memory exhaustion
allowed_ips = ["127.0.0.1"]     # List of trusted IPs to bypass checks
blocked_ips = []                # List of IPs to be immediately rejected
paranatia_level =1              # Defines how strictly rules are applied (1-4)

# -------------------------
# RateLimit init mode (config injected at init, request without config sent at each call)
# -------------------------
[[modules]]
id = "ratelimit"
enabled = true
path = "./modules/scloud-eg-rate-limit/target/wasm32-wasip1/release/scloud_eg_rate_limit.wasm"
route = "/rate-limit"
timeout_ms = 50

config_mode = "init"

# (optionnal)
# entry_fn = "handle"
# alloc_fn = "alloc"
# init_fn  = "init"

  [modules.config]
  algorithm = "token_bucket"
  rps = 100
  burst = 200
  key = "ip"
